# RoboTwin 2.0 — current-env waypoint BC same-reset gate
#
# Uses fast_init=false to match the oracle qpos capture protocol.  This is a
# same-reset waypoint-BC lower bound, not a general RoboTwin competence gate.
server:
  url: "ws://localhost:8000"
  timeout: 120

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robotwin:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    episodes_per_task: 1
    max_steps: 120
    params:
      task_name: pick_diverse_bottles
      task_config: demo_clean
      seed: 0
      instruction_type: seen
      test_num: 1
      skip_expert_check: true
      fast_init: false
    action_dim: 14
